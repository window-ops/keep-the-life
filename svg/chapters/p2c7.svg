<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="A car seen from behind at night on DN15 entering Reghin, its headlights on the lane ahead, the road curving away toward low hills. On the left, set back from the road, stand the pink motel with the MOTEL lettering, a small white gable and a balcony band under a wide red roof, and beside it the hotel wing with a white balustrade over a lit arcade and a tower carrying the HOTEL sign; on the right a power line, the violin monument of two white slabs with a violin cut through them, and the town sign, yellow above with the 50 limit and a skyline, white below with Reghin, Szászrégen and Sächsisch-Regen"><defs><clipPath id="p2c7-frame"><rect width="240" height="160" rx="10"/></clipPath><linearGradient id="p2c7-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f151d"/><stop offset="1" stop-color="#26303b"/></linearGradient><linearGradient id="p2c7-beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e8e2c4" stop-opacity="0.3"/><stop offset="0.75" stop-color="#e8e2c4" stop-opacity="0.07"/><stop offset="1" stop-color="#e8e2c4" stop-opacity="0"/></linearGradient><filter id="p2c7-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter></defs><g clip-path="url(#p2c7-frame)" fill="none" stroke="#cfd5db" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="240" height="87" fill="url(#p2c7-sky)" stroke="none"/><rect y="86" width="240" height="74" fill="#1a1f1b" stroke="none"/><path d="M-2 86C14 82.5 30 83.5 48 82S84 83 100 82.5 132 81 150 82.5 190 80 212 81.5 236 82 242 83V86.5H-2Z" fill="#283039" stroke="#465059" stroke-width="0.8"/><path d="M44 92V66.5H76V92Z" fill="#cfa7a2" stroke="#9aa3ad" stroke-width="0.8"/><path d="M41.5 67.5L60 55.5L78.5 67.5Z" fill="#6e3a2c" stroke="#9aa3ad" stroke-width="0.8"/><path d="M57.2 61.6h2v2.4h-2zM60.8 61.6h2v2.4h-2z" fill="#e8c46a" stroke="none"/><